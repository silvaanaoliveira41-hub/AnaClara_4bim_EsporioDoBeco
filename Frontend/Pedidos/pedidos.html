<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Empório Mágico do Beco</title>
    <link rel="stylesheet" href="../produto/produto.css">
    <script src="pedidos.js" defer></script>
</head>

<body>

    <header>
        <h1>Empório Mágico do Beco</h1>
        <p>Gerenciamento de Pedidos</p>
    </header>

    <main>

        <section class="vitrine" style="max-width: 1100px; margin: 0 auto;">

            <h2>✦ Pedidos Realizados ✦</h2>

            <div class="busca" style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;">
                <input
                    type="text"
                    id="buscar-pedido"
                    placeholder="Pesquisar por cliente, produto ou ID..."
                    oninput="filtrarPedidos()"
                    style="flex: 1; min-width: 240px;"
                >
                <button
                    type="button"
                    onclick="carregarPedidos()"
                    style="padding: 10px 18px; background: #7045a0; color: #fff; border: 1px solid #e2c078; border-radius: 8px; font-family: Georgia, serif; font-weight: bold; cursor: pointer;">
                    Atualizar Lista
                </button>
            </div>

            <p id="mensagem-pedidos" style="margin-bottom: 14px; font-weight: bold;"></p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Itens Comprados</th>
                        <th>Pagamento</th>
                        <th>Total</th>
                        <th>Data</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="tabela-pedidos">
                    <tr>
                        <td colspan="7">Carregando pedidos...</td>
                    </tr>
                </tbody>
            </table>

            <div class="voltar-menu">
                <a href="../administrador/administrador.html">
                    ← Voltar ao Painel do Administrador
                </a>
            </div>

        </section>

    </main>

    <footer>
        <p>Empório Mágico do Beco</p>
        <p>Painel Administrativo</p>
    </footer>

</body>
</html>
